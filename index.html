<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Rocketman - Costa Games</title>
<style>
  html, body {
    margin: 0; padding: 0; overflow: hidden;
    background: #05040c;
    width: 100%; height: 100%;
    touch-action: none;
    -webkit-user-select: none; user-select: none;
    font-family: 'Courier New', monospace;
  }
  canvas { display: block; touch-action: none; }
  #loadingWrap {
    position: fixed; inset: 0; z-index: 30; background:#05040c;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    color:#6bd0ff; letter-spacing:3px; font-family:'Courier New',monospace;
  }
  #loadingWrap .bar { width:220px; height:10px; border:2px solid #6bd0ff; margin-top:14px; }
  #loadingWrap .fill { height:100%; width:0%; background:#6bd0ff; }
  #nickWrap {
    position: fixed; left: 50%; top: 50%; transform: translate(-50%,-50%);
    z-index: 20; display: none; flex-direction: column; align-items: center;
    gap: 12px; background: rgba(10,8,25,0.94); border: 3px solid #6bd0ff;
    padding: 22px 28px; border-radius: 6px; box-shadow: 0 0 24px rgba(107,208,255,0.5);
  }
  #nickWrap.show { display: flex; }
  #nickWrap label { color: #ffe66d; font-size: 14px; letter-spacing: 2px; text-transform: uppercase; }
  #nickInput {
    font-family: 'Courier New', monospace; font-size: 20px; letter-spacing: 3px;
    text-transform: uppercase; padding: 8px 10px; width: 200px; text-align: center;
    background: #0c0a1a; color: #6bd0ff; border: 2px solid #6bd0ff; border-radius: 4px;
    outline: none;
  }
  #nickBtn {
    font-family: 'Courier New', monospace; font-weight: bold; font-size: 16px;
    padding: 10px 22px; background: #ff6b6b; color: #fff; border: 3px solid #fff;
    border-radius: 4px; cursor: pointer; letter-spacing: 2px;
  }
  #nickBtn:active { transform: scale(0.96); }
</style>
</head>
<body>

<div id="loadingWrap">
  <div>CARREGANDO ROCKETMAN...</div>
  <div class="bar"><div class="fill" id="loadFill"></div></div>
</div>

<div id="nickWrap">
  <label>Digite seu apelido, piloto</label>
  <input id="nickInput" maxlength="10" placeholder="PILOTO">
  <button id="nickBtn">CONFIRMAR</button>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/addons/p5.sound.min.js"></script>
<script>
/* =========================================================================
   ROCKETMAN — jogo em p5.js usando os assets originais (heroi, fundos, obstáculos)
   Produzido por Costa Games
   ========================================================================= */

// ---------- ESTADOS ----------
const ST_MENU='MENU', ST_NICK='NICK', ST_BOOST='BOOST', ST_LAUNCH='LAUNCH',
      ST_FLIGHT='FLIGHT', ST_FALL='FALL', ST_OVER='OVER';
let state = ST_MENU;

// ---------- LAYOUT (campo vertical centralizado — funciona desktop e mobile) ----------
let W = 420, H = 800, offsetX = 0;
function computeLayout() {
  W = Math.min(windowWidth, 560);
  H = windowHeight;
  offsetX = (windowWidth - W) / 2;
}

// ---------- ASSETS ----------
let img = {}; // imagens carregadas
const ASSET_LIST = [
  ['heroi','assets/heroi.png'],
  ['fundo1','assets/fundo1.jpg'],  // solo / grama (menu, boost)
  ['fundo2','assets/fundo2.jpg'],  // céu claro dia
  ['fundo3','assets/fundo3.jpg'],  // céu dia com brilho
  ['fundo4','assets/fundo4.jpg'],  // camada de nuvens densas
  ['fundo5','assets/fundo5.jpg'],  // crepúsculo / transição espaço
  ['fundo6','assets/fundo6.jpg'],  // borda da atmosfera
  ['fundo7','assets/fundo7.jpg'],  // espaço profundo
  ['ob1','assets/ob1.png'],        // balão
  ['ob2','assets/ob2.png'],        // pássaro
  ['ob3','assets/ob3.png'],        // ovni
  ['ob4','assets/ob4.png'],        // meteoro
];
let assetsLoaded = 0;
function preload() {
  for (const [key, path] of ASSET_LIST) {
    img[key] = loadImage(path,
      () => { assetsLoaded++; updateLoadingBar(); },
      () => { assetsLoaded++; updateLoadingBar(); console.warn('Falhou ao carregar', path); }
    );
  }
}
function updateLoadingBar() {
  const pct = Math.round((assetsLoaded/ASSET_LIST.length)*100);
  const fill = document.getElementById('loadFill');
  if (fill) fill.style.width = pct+'%';
  if (assetsLoaded >= ASSET_LIST.length) {
    const w = document.getElementById('loadingWrap');
    if (w) w.style.display = 'none';
  }
}

// ---------- DADOS PERSISTENTES ----------
let nickname = '';
let highScore = 0;
let leaderboard = [];
function loadSave() {
  nickname = localStorage.getItem('rocketman_nick') || '';
  highScore = parseFloat(localStorage.getItem('rocketman_hs') || '0');
  try { leaderboard = JSON.parse(localStorage.getItem('rocketman_board') || '[]'); }
  catch(e){ leaderboard = []; }
}
function saveScore(alt) {
  alt = Math.floor(alt);
  if (alt > highScore) { highScore = alt; localStorage.setItem('rocketman_hs', String(highScore)); }
  leaderboard.push({ name: nickname || 'PILOTO', alt: alt, date: Date.now() });
  leaderboard.sort((a,b)=>b.alt-a.alt);
  leaderboard = leaderboard.slice(0,5);
  localStorage.setItem('rocketman_board', JSON.stringify(leaderboard));
}

// ---------- ÁUDIO (sintetizado via p5.sound, sem arquivos de som) ----------
let audioReady = false;
let engineOsc, engineNoise, padOsc1, padOsc2;
function initAudio() {
  if (audioReady) return;
  userStartAudio();
  padOsc1 = new p5.Oscillator('sine'); padOsc1.freq(110); padOsc1.amp(0); padOsc1.start();
  padOsc2 = new p5.Oscillator('triangle'); padOsc2.freq(165); padOsc2.amp(0); padOsc2.start();
  engineOsc = new p5.Oscillator('sawtooth'); engineOsc.freq(60); engineOsc.amp(0); engineOsc.start();
  engineNoise = new p5.Noise('brown'); engineNoise.amp(0); engineNoise.start();
  audioReady = true;
}
function blip(freq, dur, type, vol) {
  if (!audioReady) return;
  let o = new p5.Oscillator(type || 'square');
  let e = new p5.Envelope();
  e.setADSR(0.005, dur*0.4, 0.0, dur*0.4);
  e.setRange(vol || 0.25, 0);
  o.freq(freq); o.amp(0); o.start();
  e.play(o);
  setTimeout(()=>o.stop(), (dur+0.3)*1000);
}
function sndTap(pitch) { blip(340 + pitch*4, 0.07, 'square', 0.18); }
function sndClick() { blip(440, 0.08, 'triangle', 0.22); }
function sndLaunch() {
  if (!audioReady) return;
  let o = new p5.Oscillator('sawtooth');
  let e = new p5.Envelope(); e.setADSR(0.05, 0.9, 0.1, 0.6); e.setRange(0.3, 0);
  o.amp(0); o.start(); o.freq(80);
  let t0 = millis();
  let sweep = setInterval(()=>{
    let k = (millis()-t0)/900;
    if (k>=1) { clearInterval(sweep); return; }
    o.freq(80 + k*500);
  }, 30);
  e.play(o);
  setTimeout(()=>o.stop(), 1500);
}
function sndHit() {
  if (!audioReady) return;
  let n = new p5.Noise('white');
  let ne = new p5.Envelope(); ne.setADSR(0.001,0.25,0,0.1); ne.setRange(0.35,0);
  n.amp(0); n.start(); ne.play(n); setTimeout(()=>n.stop(), 500);
  let o = new p5.Oscillator('sine');
  let e = new p5.Envelope(); e.setADSR(0.001,0.3,0,0.1); e.setRange(0.4,0);
  o.freq(70); o.amp(0); o.start(); e.play(o); setTimeout(()=>o.stop(), 500);
}
function sndGameOver() {
  if (!audioReady) return;
  let o = new p5.Oscillator('sawtooth');
  o.amp(0); o.start(); o.freq(300);
  let e = new p5.Envelope(); e.setADSR(0.02,1.2,0,0.3); e.setRange(0.3,0);
  e.play(o);
  let t0=millis();
  let sweep = setInterval(()=>{
    let k=(millis()-t0)/1200;
    if (k>=1){ clearInterval(sweep); return; }
    o.freq(300 - k*220);
  },30);
  setTimeout(()=>o.stop(),1600);
}
function updateEngineSound() {
  if (!audioReady) return;
  if (state === ST_FLIGHT || state === ST_FALL) {
    let target = 0.10 + 0.12 * constrain(rocket.fuel/rocket.maxFuel, 0, 1);
    engineOsc.amp(target, 0.1);
    engineOsc.freq(55 + 30*constrain(rocket.fuel/rocket.maxFuel,0,1));
    engineNoise.amp(0.05, 0.1);
  } else {
    engineOsc.amp(0, 0.3);
    engineNoise.amp(0, 0.3);
  }
  if (state === ST_MENU) { padOsc1.amp(0.05, 0.5); padOsc2.amp(0.03, 0.5); }
  else { padOsc1.amp(0, 0.5); padOsc2.amp(0, 0.5); }
}

// ---------- UTIL: texto pixelado ----------
function pixelText(txt, x, y, size, colMain, colShadow, align) {
  push();
  textFont('monospace'); textStyle(BOLD);
  textAlign(align || CENTER, CENTER);
  textSize(size);
  noStroke();
  fill(colShadow || color(0,0,0,180));
  text(txt, x + size*0.06, y + size*0.09);
  fill(colMain);
  text(txt, x, y);
  pop();
}

// ---------- BANDAS DE ALTITUDE (ligadas aos fundos reais) ----------
const STAGES = [
  { key:'fundo2', from: 0,     to: 3000  },  // céu claro
  { key:'fundo3', from: 3000,  to: 8000  },  // céu com brilho
  { key:'fundo4', from: 8000,  to: 15000 },  // nuvens densas
  { key:'fundo5', from: 15000, to: 24000 },  // crepúsculo/transição
  { key:'fundo6', from: 24000, to: 34000 },  // borda da atmosfera
  { key:'fundo7', from: 34000, to: Infinity }, // espaço profundo
];
function currentStageInfo(alt) {
  for (let i=0;i<STAGES.length;i++) {
    let s = STAGES[i];
    if (alt < s.to || i===STAGES.length-1) {
      let next = STAGES[min(i+1, STAGES.length-1)];
      let transitionW = 1800;
      let blend = 0;
      if (alt > s.to - transitionW && i < STAGES.length-1) {
        blend = constrain(map(alt, s.to-transitionW, s.to, 0, 1), 0, 1);
      }
      return { idx:i, cur:s, next:next, blend:blend };
    }
  }
  return { idx:0, cur:STAGES[0], next:STAGES[1], blend:0 };
}

function drawCoverImage(image, alpha) {
  if (!image || !image.width) return;
  push();
  let scaleF = max(W/image.width, H/image.height);
  let iw = image.width*scaleF, ih = image.height*scaleF;
  imageMode(CENTER);
  tint(255, alpha===undefined?255:alpha);
  image(image, W/2, H/2, iw, ih);
  noTint();
  pop();
}
function drawBackground(alt) {
  push();
  drawingContext.save();
  drawingContext.beginPath();
  drawingContext.rect(0,0,W,H);
  drawingContext.clip();
  let info = currentStageInfo(alt);
  drawCoverImage(img[info.cur.key], 255);
  if (info.blend > 0) drawCoverImage(img[info.next.key], info.blend*255);
  drawingContext.restore();
  pop();
}
function drawGroundBackground() {
  push();
  drawingContext.save();
  drawingContext.beginPath();
  drawingContext.rect(0,0,W,H);
  drawingContext.clip();
  drawCoverImage(img.fundo1, 255);
  drawingContext.restore();
  pop();
}

// estrelas extra (só desenhadas por cima do espaço profundo p/ reforçar cintilação)
let stars = [];
function genStars() {
  stars = [];
  for (let i=0;i<60;i++) stars.push({ x: random(W), y: random(H), r: random(0.6,2.2), sp: random(0.02,0.06), ph: random(TWO_PI) });
}
function drawTwinkles(alt) {
  let info = currentStageInfo(alt);
  let inSpace = (info.cur.key==='fundo6' || info.cur.key==='fundo7' || (info.blend>0 && (info.next.key==='fundo6'||info.next.key==='fundo7')));
  if (!inSpace) return;
  noStroke();
  for (let s of stars) {
    let a = 120+100*sin(frameCount*s.sp+s.ph);
    fill(255,255,255,a);
    ellipse(s.x, s.y, s.r, s.r);
  }
}

// ---------- FOGUETE ----------
class Rocket {
  constructor() {
    this.x = W/2; this.y = H*0.72;
    this.vx = 0; this.vy = 0;
    this.maxFuel = 0; this.fuel = 0;
    this.hitTimer = 0; this.invuln = 0;
    this.angleWobble = 0;
    this.dispH = 92;
    this.r = 26;
  }
  update(dt) {
    let ax = 0, ay = 0;
    if (keyIsPressed) {
      if (keyIsDown(LEFT_ARROW) || keyIsDown(65)) ax -= 1;
      if (keyIsDown(RIGHT_ARROW) || keyIsDown(68)) ax += 1;
      if (keyIsDown(UP_ARROW) || keyIsDown(87)) ay -= 1;
      if (keyIsDown(DOWN_ARROW) || keyIsDown(83)) ay += 1;
    }
    if (dragTarget) {
      let dx = dragTarget.x - this.x, dy = dragTarget.y - this.y;
      ax += constrain(dx/40, -1, 1);
      ay += constrain(dy/40, -1, 1);
    }
    let accel = 0.85;
    this.vx = lerp(this.vx, ax*5.2, accel*dt*4);
    this.vy = lerp(this.vy, ay*5.2, accel*dt*4);
    this.x += this.vx; this.y += this.vy;
    this.x = constrain(this.x, 34, W-34);
    this.y = constrain(this.y, H*0.16, H*0.92);
    this.angleWobble = this.vx*0.03;
    if (this.hitTimer > 0) this.hitTimer -= dt;
    if (this.invuln > 0) this.invuln -= dt;
  }
  draw() {
    push();
    translate(this.x, this.y);
    rotate(this.angleWobble);
    let flashing = this.hitTimer > 0 && floor(frameCount/4)%2===0;

    // chama do motor (procedural, atrás do sprite)
    if (state===ST_FLIGHT || state===ST_LAUNCH) {
      let fFrac = constrain(this.fuel/max(this.maxFuel,1),0,1);
      let flameLen = 16 + 26*fFrac + random(-4,4);
      let fy = this.dispH*0.42;
      noStroke();
      fill(255,170,50,200); triangle(-10,fy, 10,fy, 0,fy+flameLen*0.65);
      fill(255,220,110,220); triangle(-5,fy, 5,fy, 0,fy+flameLen);
      fill(255,255,220,230); triangle(-2,fy, 2,fy, 0,fy+flameLen*0.5);
    }

    imageMode(CENTER);
    let iw = img.heroi.width, ih = img.heroi.height;
    let scaleF = this.dispH/ih;
    if (flashing) {
      tint(255,90,90);
    } else {
      tint(255,255);
    }
    image(img.heroi, 0, 0, iw*scaleF, ih*scaleF);
    noTint();
    pop();
  }
}
let rocket;
let dragTarget = null;

// ---------- OBSTÁCULOS (mapeados para os assets fornecidos) ----------
// ordem de dificuldade: pássaro < balão < meteoro < ovni
const OBS_TYPES = {
  bird:    { key:'ob2', dmg:80,  speed:[1.0,1.8], dispW:60,  bands:[0,1] },
  balloon: { key:'ob1', dmg:120, speed:[0.5,1.1], dispW:56,  bands:[0,1,2] },
  meteor:  { key:'ob4', dmg:210, speed:[3.0,5.0], dispW:70,  bands:[2,3,4,5] },
  ufo:     { key:'ob3', dmg:250, speed:[2.2,3.8], dispW:78,  bands:[3,4,5] },
};
function pickObstacleType(bandIdx) {
  let pool = [];
  for (const [name, def] of Object.entries(OBS_TYPES)) {
    if (def.bands.includes(bandIdx)) pool.push(name);
  }
  if (pool.length===0) pool = ['bird'];
  return random(pool);
}
let obstacles = [];
let spawnTimer = 0;

class Obstacle {
  constructor(type, bandIdx, altitude) {
    this.type = type;
    let def = OBS_TYPES[type];
    this.def = def;
    let image_ = img[def.key];
    let ar = image_.height/image_.width;
    this.w = def.dispW; this.h = def.dispW*ar;
    this.x = random(this.w, W-this.w);
    this.y = -this.h;
    let diffMul = 1 + constrain(altitude/24000, 0, 2.4);
    this.speed = random(def.speed[0], def.speed[1]) * diffMul;
    this.vx = random(-0.6,0.6) * diffMul;
    this.dmg = def.dmg;
    this.phase = random(TWO_PI);
    this.erratic = (type==='ufo');
    this.dead = false;
    this.rot = 0;
  }
  update(dt, scrollSpeed) {
    this.y += (this.speed + scrollSpeed) * dt;
    this.phase += 0.05*dt;
    this.x += sin(this.phase)*0.5*dt + this.vx*dt;
    if (this.erratic && frameCount % 40 === 0) this.vx = random(-2.2,2.2);
    this.x = constrain(this.x, this.w/2, W-this.w/2);
    if (this.type==='meteor') this.rot += 0.05*dt;
    if (this.y > H+this.h) this.dead = true;
  }
  hitRadius() { return (this.w+this.h)/4.6; }
  draw() {
    push();
    translate(this.x,this.y);
    if (this.type==='meteor') rotate(this.rot);
    if (this.type==='bird') {
      let dir = this.vx >= 0 ? 1 : -1;
      scale(dir,1);
    }
    imageMode(CENTER);
    image(img[this.def.key], 0, 0, this.w, this.h);
    pop();
  }
}

// ---------- PARTÍCULAS (explosão) ----------
let particles = [];
function spawnExplosion(x,y,n,cols) {
  for (let i=0;i<n;i++) {
    particles.push({ x:x,y:y, vx:random(-4,4), vy:random(-4,4), life:random(20,40), maxLife:40, r:random(3,8), col:random(cols) });
  }
}
function updateParticles(dt) {
  for (let i=particles.length-1;i>=0;i--) {
    let p = particles[i];
    p.x += p.vx*dt; p.y += p.vy*dt; p.vy += 0.08*dt;
    p.life -= dt;
    if (p.life<=0) particles.splice(i,1);
  }
}
function drawParticles() {
  noStroke();
  for (let p of particles) {
    let a = map(p.life,0,p.maxLife,0,255);
    fill(red(p.col),green(p.col),blue(p.col),a);
    ellipse(p.x,p.y,p.r*(p.life/p.maxLife+0.3));
  }
}

// ---------- VARS DE JOGO ----------
let boostValue = 0, boostTimer = 10.0;
let altitude = 0, maxAltitude = 0;
let scrollSpeed = 0;
let fallSpeed = 0;
let shakeT = 0;
let camShakeX=0, camShakeY=0;
let menuButtons = {}, overButtons = {};
let lastFrameTime = 0;
let launchT = 0;

// ---------- SETUP ----------
function setup() {
  computeLayout();
  let cnv = createCanvas(windowWidth, windowHeight);
  cnv.parent(document.body);
  pixelDensity(1);
  loadSave();
  genStars();
  rocket = new Rocket();
  lastFrameTime = millis();
  setupNickUI();
}
function windowResized() {
  resizeCanvas(windowWidth, windowHeight);
  computeLayout();
  genStars();
}

// ---------- LOOP PRINCIPAL ----------
function draw() {
  if (assetsLoaded < ASSET_LIST.length) { background(5,4,12); return; }

  let now = millis();
  let dt = constrain((now-lastFrameTime)/16.67, 0, 3);
  lastFrameTime = now;

  background(4,4,10);
  push();
  translate(offsetX + camShakeX, camShakeY);
  noStroke(); fill(4,4,10); rect(-6,0,6,H); rect(W,0,6,H);

  switch(state) {
    case ST_MENU: drawMenu(dt); break;
    case ST_NICK: drawGroundBackground(); break;
    case ST_BOOST: updateBoost(dt); drawBoost(dt); break;
    case ST_LAUNCH: updateLaunch(dt); drawFlightScene(dt); drawLaunchOverlay(); break;
    case ST_FLIGHT: updateFlight(dt); drawFlightScene(dt); drawHUD(); break;
    case ST_FALL: updateFall(dt); drawFlightScene(dt); drawHUD(); break;
    case ST_OVER: drawFlightScene(dt); drawGameOver(dt); break;
  }
  pop();

  if (shakeT>0) {
    shakeT -= dt;
    camShakeX = random(-6,6)*constrain(shakeT/10,0,1);
    camShakeY = random(-6,6)*constrain(shakeT/10,0,1);
  } else { camShakeX = 0; camShakeY = 0; }

  updateEngineSound();

  noStroke(); fill(150,160,190);
  textFont('monospace'); textSize(11); textAlign(CENTER,BOTTOM);
  text('Produzido por Costa Games', windowWidth/2, windowHeight-6);
}

// ============================================================
// MENU
// ============================================================
function drawMenu(dt) {
  drawGroundBackground();
  push(); noStroke(); fill(0,0,0,90); rect(0,0,W,H); pop();

  pixelText('ROCKETMAN', W/2, H*0.18, min(W*0.11,46), color(255,90,90), color(30,10,10));
  push(); noStroke(); fill(255,230,150); textFont('monospace'); textStyle(BOLD);
  textAlign(CENTER,CENTER); textSize(min(W*0.045,18));
  text('rumo à estratosfera!', W/2, H*0.24);
  pop();

  push(); translate(W/2, H*0.42); rotate(sin(frameCount*0.02)*0.05);
  rocket.dispH = min(W*0.34, 140);
  let sx=rocket.x, sy=rocket.y; rocket.x=0; rocket.y=0;
  rocket.draw();
  rocket.x=sx; rocket.y=sy;
  pop();

  push(); noStroke(); textFont('monospace'); textAlign(CENTER,CENTER);
  fill(255,255,255); textSize(min(W*0.045,17));
  text('Piloto: ' + (nickname || '---'), W/2, H*0.56);
  fill(255,220,90);
  text('Recorde: ' + floor(highScore) + ' m', W/2, H*0.593);
  pop();

  if (leaderboard.length) {
    push(); textFont('monospace'); textAlign(CENTER,CENTER); noStroke();
    fill(200,220,255); textSize(min(W*0.035,13));
    text('— MELHORES VOOS —', W/2, H*0.64);
    for (let i=0;i<leaderboard.length;i++) {
      fill(230,230,240);
      text((i+1)+'. '+leaderboard[i].name+' - '+leaderboard[i].alt+'m', W/2, H*0.64 + (i+1)*18);
    }
    pop();
  }

  let bx=W/2, by=H*0.81, bw=min(W*0.6,220), bh=54;
  menuButtons.start = {x:bx-bw/2,y:by-bh/2,w:bw,h:bh};
  drawButton(menuButtons.start, 'INICIAR', color(90,200,120));

  push(); noStroke(); fill(210,215,230); textFont('monospace'); textSize(min(W*0.032,12));
  textAlign(CENTER,CENTER);
  text('Setas/WASD ou arraste para mover · ESPAÇO/toque para impulsionar', W/2, H*0.90);
  pop();
}
function drawButton(b, label, col) {
  push();
  stroke(255); strokeWeight(3);
  fill(col);
  rectMode(CORNER);
  rect(b.x,b.y,b.w,b.h,8);
  pixelText(label, b.x+b.w/2, b.y+b.h/2+1, min(b.w*0.11,20), color(255), color(0,0,0,150));
  pop();
}

// ---------- UI DE NICKNAME (DOM) ----------
function setupNickUI() {
  const wrap = document.getElementById('nickWrap');
  const input = document.getElementById('nickInput');
  const btn = document.getElementById('nickBtn');
  input.value = nickname;
  btn.addEventListener('click', confirmNick);
  input.addEventListener('keydown', (e)=>{ if (e.key==='Enter') confirmNick(); });
  function confirmNick() {
    let v = input.value.trim().toUpperCase().slice(0,10);
    nickname = v || 'PILOTO';
    localStorage.setItem('rocketman_nick', nickname);
    wrap.classList.remove('show');
    state = ST_BOOST;
    resetBoostPhase();
    sndClick();
  }
}
function showNickUI() {
  document.getElementById('nickWrap').classList.add('show');
  document.getElementById('nickInput').value = nickname;
  setTimeout(()=>document.getElementById('nickInput').focus(), 50);
}

// ============================================================
// FASE DE IMPULSO
// ============================================================
function resetBoostPhase() {
  boostValue = 0; boostTimer = 10.0;
  rocket = new Rocket();
  rocket.x = W/2; rocket.y = H*0.68;
  rocket.dispH = min(W*0.28, 110);
}
function updateBoost(dt) {
  boostTimer -= (dt/60);
  boostValue = max(0, boostValue - dt*0.12);
  if (boostTimer <= 0) { boostTimer = 0; startLaunch(); }
}
function tapBoost() {
  if (state !== ST_BOOST) return;
  boostValue = min(100, boostValue + random(6,9));
  sndTap(boostValue);
  shakeT = max(shakeT, 2);
}
function drawBoost(dt) {
  drawGroundBackground();
  push(); noStroke(); fill(0,0,0,70); rect(0,0,W,H); pop();
  rocket.draw();

  pixelText(ceil(boostTimer)+'', W/2, H*0.10, min(W*0.12,42), color(255,230,90), color(40,25,0));
  pixelText('APERTE ESPAÇO / TOQUE!', W/2, H*0.17, min(W*0.045,17), color(255,255,255), color(0,0,0,160));

  let bx = W*0.84, bw = W*0.10, by = H*0.28, bh = H*0.48;
  push();
  stroke(255); strokeWeight(3); noFill();
  rectMode(CORNER); rect(bx,by,bw,bh,6);
  noStroke();
  let fillH = bh*(boostValue/100);
  let c1 = color(255,90,90), c2 = color(255,230,90), c3=color(120,240,140);
  let bc = boostValue<40? c1 : boostValue<75? c2 : c3;
  fill(bc);
  rect(bx,by+bh-fillH,bw,fillH,4);
  pixelText(floor(boostValue)+'%', bx+bw/2, by-16, min(W*0.04,16), color(255), color(0,0,0,160));
  pop();

  let tb = {x:W*0.08, y:H*0.55, w:W*0.6, h:H*0.22};
  push(); stroke(255,255,255,180); strokeWeight(3);
  fill(255,255,255, 25+15*sin(frameCount*0.3));
  rect(tb.x,tb.y,tb.w,tb.h,14);
  pixelText('TOQUE AQUI', tb.x+tb.w/2, tb.y+tb.h/2, min(W*0.06,22), color(255), color(0,0,0,140));
  pop();
  menuButtons.boostZone = tb;
}

function startLaunch() {
  rocket.maxFuel = map(boostValue,0,100,900,3400);
  rocket.fuel = rocket.maxFuel;
  rocket.dispH = min(W*0.22, 92);
  altitude = 0; maxAltitude = 0;
  obstacles = []; particles = [];
  scrollSpeed = map(boostValue,0,100,2.5,7.5);
  sndLaunch();
  state = ST_LAUNCH;
  launchT = 0;
}
function updateLaunch(dt) {
  launchT += dt;
  rocket.y = lerp(rocket.y, H*0.62, 0.06*dt);
  if (launchT > 55) state = ST_FLIGHT;
}
function drawLaunchOverlay() {
  pixelText('DECOLAGEM!', W/2, H*0.12, min(W*0.09,34), color(255,230,90), color(60,30,0));
}

// ============================================================
// VOO
// ============================================================
function updateFlight(dt) {
  rocket.update(dt);

  let fuelFrac = constrain(rocket.fuel/rocket.maxFuel,0,1);
  scrollSpeed = 2 + fuelFrac*7;
  rocket.fuel -= dt;
  altitude += scrollSpeed * dt * 12;
  maxAltitude = max(maxAltitude, altitude);

  let info = currentStageInfo(altitude);
  let bandIdx = info.idx;

  spawnTimer -= dt;
  let interval = map(constrain(altitude,0,60000),0,60000,52,18);
  if (spawnTimer <= 0) {
    spawnTimer = interval + random(-6,6);
    let type = pickObstacleType(bandIdx);
    obstacles.push(new Obstacle(type, bandIdx, altitude));
  }

  for (let i=obstacles.length-1;i>=0;i--) {
    let o = obstacles[i];
    o.update(dt, scrollSpeed);
    if (o.dead) { obstacles.splice(i,1); continue; }
    if (rocket.invuln<=0) {
      let d = dist(rocket.x,rocket.y,o.x,o.y);
      if (d < rocket.r + o.hitRadius()) {
        rocket.fuel -= o.dmg;
        rocket.hitTimer = 1.0;
        rocket.invuln = 1.2;
        shakeT = 14;
        spawnExplosion(o.x,o.y, 22, [color(255,150,60),color(255,220,90),color(255,80,60),color(255,255,255)]);
        sndHit();
        obstacles.splice(i,1);
      }
    }
  }
  updateParticles(dt);

  if (rocket.fuel <= 0) { rocket.fuel = 0; fallSpeed = 1; state = ST_FALL; }
}
function updateFall(dt) {
  rocket.update(dt);
  fallSpeed += 0.15*dt;
  scrollSpeed = -fallSpeed;
  altitude += scrollSpeed*dt*12;
  for (let i=obstacles.length-1;i>=0;i--) {
    let o = obstacles[i];
    o.update(dt, scrollSpeed*0.4);
    if (o.dead) obstacles.splice(i,1);
  }
  updateParticles(dt);
  if (altitude <= 0) {
    altitude = 0;
    spawnExplosion(rocket.x, rocket.y, 30, [color(255,150,60),color(255,220,90),color(255,80,60)]);
    shakeT = 18;
    sndGameOver();
    saveScore(maxAltitude);
    state = ST_OVER;
  }
}

function drawFlightScene(dt) {
  drawBackground(altitude);
  drawTwinkles(altitude);
  for (let o of obstacles) o.draw();
  rocket.draw();
  drawParticles();
}

// ---------- HUD ----------
function drawHUD() {
  push();
  textFont('monospace'); noStroke();
  fill(255,255,255); textAlign(LEFT,TOP); textSize(min(W*0.045,16));
  text('ALTITUDE', 12, 10);
  fill(255,220,90); textSize(min(W*0.07,24));
  text(floor(altitude)+' m', 12, 26);

  textAlign(RIGHT,TOP); fill(200,220,255); textSize(min(W*0.035,13));
  text('RECORDE '+floor(highScore)+'m', W-12, 10);
  fill(255,255,255); textSize(min(W*0.035,13));
  text(nickname || 'PILOTO', W-12, 26);

  let bw = W*0.5, bh=14, bx=W/2-bw/2, by=H-30;
  stroke(255); strokeWeight(2); noFill();
  rect(bx,by,bw,bh,4);
  noStroke();
  let frac = constrain(rocket.fuel/rocket.maxFuel,0,1);
  fill(frac>0.4?color(120,220,140):color(255,120,90));
  rect(bx,by,bw*frac,bh,4);
  fill(255); textAlign(CENTER,BOTTOM); textSize(min(W*0.03,11));
  text('IMPULSO', W/2, by-3);
  pop();
}

// ============================================================
// GAME OVER
// ============================================================
function drawGameOver(dt) {
  push();
  noStroke(); fill(5,5,15,190);
  rectMode(CORNER); rect(0,0,W,H);

  pixelText('FIM DE JOGO', W/2, H*0.20, min(W*0.09,32), color(255,90,90), color(30,0,0));
  pixelText('Altitude Máxima', W/2, H*0.31, min(W*0.04,15), color(220,220,240));
  pixelText(floor(maxAltitude)+' m', W/2, H*0.37, min(W*0.1,38), color(255,230,90), color(50,30,0));

  if (maxAltitude >= highScore && maxAltitude>0) {
    pixelText('★ NOVO RECORDE! ★', W/2, H*0.43, min(W*0.045,17), color(120,240,150), color(0,30,10));
  }

  if (leaderboard.length) {
    push(); textFont('monospace'); textAlign(CENTER,CENTER); noStroke();
    fill(200,220,255); textSize(min(W*0.035,13));
    text('— MELHORES VOOS —', W/2, H*0.51);
    for (let i=0;i<leaderboard.length;i++) {
      fill(230,230,240);
      text((i+1)+'. '+leaderboard[i].name+' - '+leaderboard[i].alt+'m', W/2, H*0.51 + (i+1)*18);
    }
    pop();
  }

  let bx=W/2, by=H*0.82, bw=min(W*0.62,230), bh=52;
  overButtons.retry = {x:bx-bw/2,y:by-bh/2,w:bw,h:bh};
  drawButton(overButtons.retry, 'JOGAR NOVAMENTE', color(90,200,120));
  pop();
}

// ============================================================
// INPUT
// ============================================================
function withinField(px, py) { return { x: px - offsetX, y: py }; }
function inBox(x,y,b) { return b && x>=b.x && x<=b.x+b.w && y>=b.y && y<=b.y+b.h; }

function handlePress(px,py) {
  initAudio();
  let p = withinField(px,py);
  if (state === ST_MENU) {
    if (inBox(p.x,p.y,menuButtons.start)) {
      sndClick();
      if (!nickname) { state = ST_NICK; showNickUI(); }
      else { state = ST_BOOST; resetBoostPhase(); }
    }
    return;
  }
  if (state === ST_BOOST) { tapBoost(); return; }
  if (state === ST_FLIGHT || state === ST_FALL || state === ST_LAUNCH) {
    dragTarget = { x: p.x, y: p.y };
    return;
  }
  if (state === ST_OVER) {
    if (inBox(p.x,p.y,overButtons.retry)) { sndClick(); state = ST_MENU; }
    return;
  }
}
function handleMove(px,py) {
  if (state === ST_FLIGHT || state === ST_FALL || state === ST_LAUNCH) {
    let p = withinField(px,py);
    dragTarget = { x: p.x, y: p.y };
  }
}
function handleRelease() { dragTarget = null; }

function mousePressed() { handlePress(mouseX, mouseY); }
function mouseDragged() { handleMove(mouseX, mouseY); }
function mouseReleased() { handleRelease(); }

function touchStarted() {
  if (touches.length>0) handlePress(touches[0].x, touches[0].y); else handlePress(mouseX,mouseY);
  return false;
}
function touchMoved() {
  if (touches.length>0) handleMove(touches[0].x, touches[0].y);
  return false;
}
function touchEnded() { handleRelease(); return false; }

function keyPressed() {
  initAudio();
  if (key === ' ') {
    if (state === ST_BOOST) tapBoost();
    if (state === ST_MENU) {
      if (!nickname) { state = ST_NICK; showNickUI(); }
      else { state = ST_BOOST; resetBoostPhase(); }
    }
    if (state === ST_OVER) state = ST_MENU;
    return false;
  }
}
